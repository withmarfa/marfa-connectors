packages:
  - "kit"
  - "template/connector"
  - "connectors/*"
  - "scripts"

# A tarball, not the registry: the published client is older than the pinned
# monorepo commit. A catalog would read better but refuses the `file:` protocol.
overrides:
  "@withmarfa/client": "file:vendor/withmarfa-client.tar"

# The lockfile holds the tar's integrity, so a checkout of another pin would
# otherwise keep the client already in node_modules.
optimisticRepeatInstall: false
