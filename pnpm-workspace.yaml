packages:
  - "kit"
  - "template/connector"
  - "scripts"

# Every package names the client as `*` and this line says where it comes
# from: the tar scripts/vendor-client.sh packs from the pinned monorepo
# commit, until the client is on the registry and this line names its
# version. A catalog would read better and refuses the `file:` protocol.
overrides:
  "@withmarfa/client": "file:vendor/withmarfa-client.tar"

# An install that trusts node_modules because the lockfile looks unchanged
# keeps a client installed from other bytes, after a pin moves back or a
# branch changes it.
optimisticRepeatInstall: false
