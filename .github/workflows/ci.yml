name: CI

on:
  push:
    branches: [main]
  # A draft runs only the quick checks; marking it ready for review runs the
  # rest, and so does every push after that.
  pull_request:
    branches: [main, gate-test]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `scripts/ci-changes.ts` says what a pull request or a push to `main` can
  # affect. A skipped job satisfies a required check; a workflow filtered out
  # by `paths` would leave it pending, hence jobs and not a filter. A push is
  # classified only when the commit before it had a green run of this
  # workflow, which the script asks the API for, hence `actions: read`.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      proof: ${{ steps.classify.outputs.proof }}
      image: ${{ steps.classify.outputs.image }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.ts

  # Every file is formatted and read for personal details, so a change to
  # documentation runs those two, on the root's own dependencies, which need
  # no monorepo. A draft stops after the build, typecheck, lint and format
  # check, which is what the tests are left for, and the proof and the image.
  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm install --frozen-lockfile --filter .
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm build
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm typecheck
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm lint
      - run: pnpm format:check
      - if: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false' }}
        run: pnpm test
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm exec vitest run scripts/test/tree.test.ts

  proof:
    name: Proof
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proof != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/monorepo.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm proof

  # Nothing else builds the image or reads the launchd example, so a change to
  # either, or to what the image copies, runs this.
  image:
    name: Image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check the LaunchAgent example is well-formed
        run: |
          command -v xmllint >/dev/null || sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout --nonet template/launchd.plist.example
      - run: pnpm install --frozen-lockfile
      - name: Build the template's image and each connector's
        run: |
          for dir in template/connector connectors/*; do
            name="$(node -p "require('./${dir}/package.json').name")"
            docker build -f template/Dockerfile --build-arg CONNECTOR="${name}" --build-arg CONNECTOR_DIR="${dir}" -t "image-${name}" .
          done
      - name: Check each image holds the installed registry client
        run: node --experimental-strip-types scripts/check-image-client.ts $(docker images --format '{{.Repository}}' 'image-*')

  # Scratch: mechanisms 1 and 2 mark the head pending on a draft.
  draft-pending:
    name: Draft pending
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="Gate status" -f description="Runs once ready for review"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="Gate check" -f head_sha="$SHA" -f status=in_progress -f "output[title]=Waiting" -f "output[summary]=Runs once ready for review"

  gate:
    name: ${{ github.event.pull_request.draft && 'Gate job (draft)' || 'Gate job' }}
    needs: [changes, checks, proof, image]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      checks: write
    steps:
      - id: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "state=failure" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=success" >> "$GITHUB_OUTPUT" ;;
          esac
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.verdict.outputs.state }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context="Gate status"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="Gate check" -f head_sha="$SHA" -f status=completed -f conclusion="$STATE" -f "output[title]=$STATE" -f "output[summary]=$STATE"
      - if: ${{ steps.verdict.outputs.state != 'success' }}
        run: exit 1
