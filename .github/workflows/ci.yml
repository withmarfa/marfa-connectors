name: CI

on:
  push:
    branches: [main]
  # A draft runs only the quick checks; marking it ready for review runs the
  # rest, and so does every push after that. `Full CI` is the required check.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A draft and a ready pull request have groups of their own. A draft pushed
  # and marked ready a moment later starts two runs, and in one group the later
  # queued cancels the other, which can leave `Full CI` unreported. A push to
  # `main` gets a group of its own, so a later push never cancels its verdict.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `scripts/ci-changes.ts` says what a pull request or a push to `main` can
  # affect. A skipped job satisfies a required check; a workflow filtered out
  # by `paths` would leave it pending, hence jobs and not a filter. A push is
  # classified only when the commit before it had a green run of this
  # workflow, which the script asks the API for, hence `actions: read`.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tests: ${{ steps.classify.outputs.tests }}
      proof: ${{ steps.classify.outputs.proof }}
      image: ${{ steps.classify.outputs.image }}
      full: ${{ steps.classify.outputs.full }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.ts

  # Every file is formatted and read for personal details, so a change to
  # documentation runs those two, on the root's own dependencies, which need
  # no monorepo. Checks is the quick job: when it fails on a pull request,
  # `stop` ends the slow ones.
  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm install --frozen-lockfile --filter .
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm build
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm typecheck
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm lint
      - run: pnpm format:check
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm exec vitest run scripts/test/tree.test.ts

  # The unit tests, in shards that each run a share of the test files. A change
  # to one connector alone runs that connector's tests (`scope`); anything
  # else runs them all. A test that fails runs once more and is reported.
  tests:
    name: Tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.tests != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          paths=()
          if [ -n "${SCOPE}" ] && [ "${SCOPE}" != all ]; then
            read -r -a paths <<<"${SCOPE}"
          fi
          pnpm exec vitest run --shard "${SHARD}" --passWithNoTests "${paths[@]}"

  # Each shard boots a pinned server of its own and runs the groups
  # `scripts/proof/shards.ts` gives it, so a scenario runs in exactly one.
  proof:
    name: Proof ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proof != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/monorepo.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm proof --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # Nothing else builds the image or reads the launchd example, so a change to
  # either, or to what the image copies, runs this.
  image:
    name: Image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check the LaunchAgent example is well-formed
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils; }
          xmllint --noout --nonet template/launchd.plist.example
      - run: pnpm install --frozen-lockfile
      - name: Build the template's image and each connector's
        run: |
          for dir in template/connector connectors/*; do
            name="$(node -p "require('./${dir}/package.json').name")"
            docker build -f template/Dockerfile --build-arg CONNECTOR="${name}" --build-arg CONNECTOR_DIR="${dir}" -t "image-${name}" .
          done
      - name: Check each image holds the installed registry client
        run: docker images --format '{{.Repository}}' 'image-*' | xargs node --experimental-strip-types scripts/check-image-client.ts

  # On a pull request, a failed `Checks` ends the run: the slow jobs would only
  # finish a verdict that is red already. It never runs on `main`, where every
  # job reports. The cancel ends this job too, which is why `gate` does not
  # wait for it.
  stop:
    name: Stop the slow jobs
    needs: checks
    if: ${{ always() && github.event_name == 'pull_request' && needs.checks.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "${GITHUB_RUN_ID}"

  # The one required check. A skipped job passes a required check, and a draft
  # skips the tests, `Proof` and `Image`, so on a draft this job is named `Draft
  # CI`: the required `Full CI` stays expected, which blocks a merge, until the
  # run that marking the pull request ready starts has finished every job.
  # It runs after a failed job and fails then. A cancelled run skips it, and a
  # skipped job never reports as `Full CI`, so a cancel cannot leave it green.
  # The exception is the cancel `stop` makes after a failed `Checks`: the gate
  # still runs then, and fails, so `Full CI` is red and not cancelled.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs: [changes, checks, tests, proof, image]
    if: ${{ !cancelled() || needs.checks.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
