name: CodeQL

# A pull request or a push to `main` that changes only documentation or agent
# instructions starts no run. CodeQL is not a required check, so a run that
# never starts leaves no check pending. A draft pull request is analyzed once
# it is marked ready for review, and on every push after that. A weekly run
# analyzes the whole tree.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
