name: CodeQL

# A pull request or a push to `main` that changes only documentation or agent
# instructions starts no run. CodeQL is not a required check, so a run that
# never starts leaves no check pending. A draft pull request is analyzed once
# it is marked ready for review, and on every push after that. A weekly run
# analyzes the whole tree.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - ".githooks/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  # A draft and a ready pull request have groups of their own. A draft pushed
  # and marked ready a moment later starts two runs, and in one group the later
  # queued cancels the other, which can leave `Full CI` unreported. A push to
  # `main` gets a group of its own, so a later push never cancels its verdict.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
