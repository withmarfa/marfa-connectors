name: Audit

# Informational, never a check: an advisory published against a dependency
# fails this run and leaves every other pull request's checks alone. A run
# starts weekly, by hand, and for a pull request that changes the lockfile.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - pnpm-lock.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level moderate
